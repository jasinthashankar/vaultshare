<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — VaultShare</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Space Mono', monospace;
      background: #05050A;
      color: #00f0ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    
    /* Cyber Grid */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      z-index: -1;
    }

    .card {
      position: relative;
      background: rgba(10, 10, 15, 0.8);
      border: 2px solid #8b5cf6;
      border-radius: 8px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
    }

    /* Cyber Corners */
    .corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid #00f0ff;
    }
    .corner.tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .corner.tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
    .corner.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
    .corner.br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    /* Moving Scanline */
    .card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: rgba(0, 240, 255, 0.5);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
      animation: scan 3s linear infinite;
      pointer-events: none;
      z-index: 10;
    }
    @keyframes scan {
      0% { top: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .header-group {
      border-bottom: 2px solid #00f0ff;
      padding-bottom: 15px;
      margin-bottom: 30px;
    }
    .sub {
      color: #00f0ff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .logo {
      font-size: 24px;
      font-weight: 700;
      color: #00f0ff;
      letter-spacing: 1px;
    }

    .field { margin-bottom: 20px; text-align: left; }
    
    input {
      width: 100%;
      padding: 16px 20px;
      background: #202025;
      border: none;
      color: #00f0ff;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      outline: none;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
      transition: all 0.3s ease;
    }
    input::placeholder { color: rgba(0, 240, 255, 0.4); }
    input:focus {
      background: #2a2a35;
      box-shadow: inset 0 0 0 1px #00f0ff;
    }

    .strength-bar{height:3px;background:rgba(255,255,255,0.1);border-radius:0;margin-top:8px;overflow:hidden;}
    .strength-fill{height:100%;width:0;transition:width .3s,background .3s;}
    .hint{font-size:10px;color:rgba(255,255,255,0.4);margin-top:6px; letter-spacing:1px;}

    .btn {
      width: 100%;
      padding: 16px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
      transition: all 0.3s ease;
    }
    .btn:hover {
      background: rgba(0, 240, 255, 0.1);
      border-color: #00f0ff;
      color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(0, 240, 255, 0.3);
      border-top-color: #00f0ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .alert {
      padding: 12px 14px;
      font-size: 12px;
      margin-bottom: 20px;
      display: none;
      gap: 8px;
      align-items: flex-start;
      text-align: left;
      border: 1px solid rgba(0, 240, 255, 0.3);
      background: rgba(0, 0, 0, 0.5);
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    }
    .alert.err { color: #ff003c; border-color: rgba(255, 0, 60, 0.4); }
    .alert.ok { color: #00ff88; border-color: rgba(0, 255, 136, 0.4); }
    .alert.show { display: flex !important; }

    .divider {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }
    .divider a {
      color: #8b5cf6;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.2s;
    }
    .divider a:hover { color: #00f0ff; text-shadow: 0 0 8px rgba(0, 240, 255, 0.5); }
  </style>
</head>
<body>
<div class="card">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="header-group">
    <div class="sub">UPDATE</div>
    <div class="logo">// CREDENTIALS</div>
  </div>

  <div class="alert err" id="err"><span>⚠️</span><span id="errMsg"></span></div>
  <div class="alert ok"  id="ok" ><span>✅</span><span id="okMsg"></span></div>

  <form id="updateForm" onsubmit="doUpdatePassword(event)">
  <div class="field">
    <input type="password" id="password" placeholder="new_key (min 8)"
           autocomplete="new-password" oninput="onPwInput(this.value)"/>
    <div class="strength-bar"><div class="strength-fill" id="sfill"></div></div>
    <div class="hint" id="stext">ENTER_SECURE_KEY</div>
  </div>

  <div class="field">
    <input type="password" id="confirm" placeholder="verify_new_key" autocomplete="new-password"/>
  </div>

  <button type="submit" class="btn" id="btn">
    <div class="spinner" id="spin"></div>
    <span id="btnTxt">UPDATE_KEY</span>
  </button>
  </form>

  <div class="divider"><a href="/login">ABORT // RETURN</a></div>
</div>

<script>
  let recoveryToken = '';

  window.addEventListener('DOMContentLoaded', () => {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    if (params.has('access_token')) {
      recoveryToken = params.get('access_token');
    } else {
      showErr('ERR: RECOVERY_TOKEN_MISSING. ABORTING.');
      document.getElementById('btn').disabled = true;
    }
  });

  function onPwInput(v){
    let s=0;
    if(v.length>=8)s++; if(v.length>=12)s++; if(/[A-Z]/.test(v))s++;
    if(/[0-9]/.test(v))s++; if(/[^A-Za-z0-9]/.test(v))s++;
    const c=['rgba(255,255,255,0.2)','#ff003c','#ff8844','#fcee0a','#00ff88','#00f0ff'][Math.min(s,5)];
    const l=['ENTER_SECURE_KEY','VULNERABLE','ADEQUATE','RESILIENT','SECURE','FORTIFIED //'][Math.min(s,5)];
    const f=document.getElementById('sfill');
    f.style.width=[0,25,50,75,90,100][Math.min(s,5)]+'%';
    f.style.background=c;
    const t=document.getElementById('stext'); t.textContent=l; t.style.color=c;
  }

  function showErr(msg){
    const e=document.getElementById('err');
    document.getElementById('errMsg').textContent=msg;
    document.getElementById('ok').className='alert ok';
    e.className='alert err show';
  }
  function showOk(msg){
    const e=document.getElementById('ok');
    document.getElementById('okMsg').textContent=msg;
    document.getElementById('err').className='alert err';
    e.className='alert ok show';
  }
  function setLoading(on){
    document.getElementById('btn').disabled=on;
    document.getElementById('spin').style.display=on?'block':'none';
    document.getElementById('btnTxt').textContent=on?'UPDATING...':'UPDATE_KEY';
  }

  async function doUpdatePassword(event){
    if (event) event.preventDefault();
    const pw      = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    document.getElementById('err').className='alert err';
    document.getElementById('ok').className='alert ok';

    if(!pw)               return showErr('ERR: SECURE_KEY_REQUIRED');
    if(pw.length<8)       return showErr('ERR: KEY_TOO_SHORT');
    if(pw!==confirm)      return showErr('ERR: KEY_MISMATCH');
    if(!recoveryToken)    return showErr('ERR: NO_TOKEN');

    setLoading(true);

    try {
      const res = await fetch('/api/auth/update-password', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization': `Bearer ${recoveryToken}`
        },
        body:JSON.stringify({ newPassword: pw })
      });

      const data = await res.json();

      if(!res.ok){
        showErr(data.error || 'ERR: UPDATE_FAILED');
        setLoading(false); return;
      }

      showOk('KEY_UPDATED! REDIRECTING...');
      setTimeout(()=>{ window.location.replace('/login'); }, 2000);

    } catch(networkErr){
      showErr('ERR: HOST_UNREACHABLE ('+networkErr.message+')');
      setLoading(false);
    }
  }
</script>
</body>
</html>
