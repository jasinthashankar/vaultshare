<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — VaultShare</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0d0d1a;color:#e2e8f0;
         min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#13132b;border:1px solid #2a2a4a;border-radius:18px;
          padding:44px 40px;width:100%;max-width:430px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
    .logo{font-size:26px;font-weight:800;color:#7c3aed}
    .sub{color:#64748b;font-size:13px;margin-top:4px;margin-bottom:28px}
    label{display:block;font-size:11px;font-weight:700;color:#94a3b8;
          margin-bottom:5px;letter-spacing:.6px;text-transform:uppercase}
    .field{margin-bottom:16px}
    input{width:100%;padding:12px 14px;background:#0d0d1a;border:1.5px solid #2a2a4a;
          border-radius:10px;color:#e2e8f0;font-size:14px;outline:none;transition:border-color .2s}
    input:focus{border-color:#7c3aed}
    .btn{width:100%;padding:13px;background:#7c3aed;border:none;border-radius:10px;
         color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;
         display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
    .btn:hover{background:#6d28d9}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
             border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    .alert{border-radius:10px;padding:12px 14px;font-size:13px;
           margin-bottom:14px;display:none;gap:8px;align-items:flex-start;
           word-break:break-word;line-height:1.5}
    .alert.err{background:#1f0a0a;border:1px solid #7f1d1d;color:#fca5a5}
    .alert.ok {background:#052e16;border:1px solid #166534;color:#86efac}
    .alert.show{display:flex !important}
    .divider{text-align:center;margin-top:18px;font-size:13px;color:#475569}
    .divider a{color:#7c3aed;text-decoration:none;font-weight:600}
    .divider a:hover{text-decoration:underline}
  </style>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="card">
  <div class="logo">🔒 VaultShare</div>
  <div class="sub">Sign in to your secure dashboard</div>

  <div class="alert err" id="err"><span>⚠️</span><span id="errMsg"></span></div>
  <div class="alert ok"  id="ok" ><span>✅</span><span id="okMsg"></span></div>

  <form id="loginForm" onsubmit="doLogin(event)">
  <div class="field">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="Your password" autocomplete="current-password"/>
  </div>

  <button type="submit" class="btn" id="btn">
    <div class="spinner" id="spin"></div>
    <span id="btnTxt">Sign In</span>
  </button>
  </form>

  <div class="divider">Don't have an account? <a href="/register">Register here</a></div>
</div>

<script>
  // Already logged in? Go to dashboard
  (function(){
    try { if(localStorage.getItem('vaultToken')) window.location.replace('/dashboard'); }
    catch(e){}
  })();

  function showErr(msg){
    const e=document.getElementById('err');
    document.getElementById('errMsg').textContent=msg;
    document.getElementById('ok').className='alert ok';
    e.className='alert err show';
  }
  function showOk(msg){
    const e=document.getElementById('ok');
    document.getElementById('okMsg').textContent=msg;
    document.getElementById('err').className='alert err';
    e.className='alert ok show';
  }
  function setLoading(on){
    document.getElementById('btn').disabled=on;
    document.getElementById('spin').style.display=on?'block':'none';
    document.getElementById('btnTxt').textContent=on?'Signing in…':'Sign In';
  }

  async function doLogin(event){
    if (event) event.preventDefault();
    const email = document.getElementById('email').value.trim();
    const pw    = document.getElementById('password').value;

    document.getElementById('err').className='alert err';
    document.getElementById('ok').className='alert ok';

    if(!email) return showErr('Please enter your email.');
    if(!pw)    return showErr('Please enter your password.');

    setLoading(true);

    try {
      showOk('Contacting server…');

      const res = await fetch('/api/auth/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email, password:pw})
      });

      // Always read as text first, then parse — this shows us exactly what server returned
      const rawText = await res.text();
      let data;
      try { data = JSON.parse(rawText); }
      catch(e){
        showErr('Server returned unexpected response:\n'+rawText.substring(0,300));
        setLoading(false); return;
      }

      if(!res.ok){
        showErr(data.error || 'Login failed (HTTP '+res.status+')');
        setLoading(false); return;
      }

      if(!data.token){
        showErr('Server did not return a token. Got: '+JSON.stringify(data));
        setLoading(false); return;
      }

      showOk('Login successful! Redirecting…');
      localStorage.setItem('vaultToken', data.token);
      localStorage.setItem('vaultUser',  JSON.stringify(data.user));
      setTimeout(()=>{ window.location.replace('/dashboard'); }, 1200);

    } catch(networkErr){
      showErr('Cannot reach server. Is it running on port 3000? Error: '+networkErr.message);
      setLoading(false);
    }
  }
</script>
  <script src="/script.js"></script>
</body>
</html>
